<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>parallax</title>
<style>
    * {
    margin:0;
    padding:0;
    box-sizing :border-box;
    font-family:"jost";
    }
    h2{
        font-size:128px;
        font-weight:bold;
        text-transform:uppercase;
        color:#fff;
        text-shadow:2px 2px 5px #000;

    }
    p{
        font-size:20px ;
        color:#fff;

    }
    section{
        width:100%;
        height:100vh;
        display:grid; 
        place-items:center;
        text-align:center;
        background-image: linear-gradient(
            rgba(0,0,0,0.3),
            rgba(0,0,0,0.3)
        ),
        url("olivia.webp");
        background-repeat:no-repeat;
        background-size:cover;
        background-position: center;
        background-attachment: fixed;
        
        

    }
.section-3{
    
        width:100%;
        height:100vh;
        display:grid; 
        place-items:center;
        text-align:center;
        background-image: linear-gradient(
            rgba(0,0,0,0.3),
            rgba(0,0,0,0.3)
        ),
        url("taylor.avif");
        background-repeat:no-repeat;
        background-size:cover;
        background-position: center;
        background-attachment: fixed;

}
.section-4{
    width:100%;
        height:100vh;
        display:grid; 
        place-items:center;
        text-align:center;
        background-image: linear-gradient(
            rgba(0,0,0,0.3),
            rgba(0,0,0,0.3)
        ),
        url("sabrina.webp");
        background-repeat:no-repeat;
        background-size:cover;
        background-position: center;
        background-attachment: fixed;}
    .tagline{
        font: size 50px;
/*  */
        }

</style>
</head>
   <body>
    <section>
        <div>
            <h2>FAV SINGERS</h2>
            <p>Some voices jsut feel like home</p>
            </div>
        
    </section>
    <section class="section-2">
        <div>
            <h2>
                OLIVIA RODRIGO
            </h2>
            <p class="tagline">A little chaos a lit of olivia</p>
        </div>
    </section>
    <section class="section-3">
        <div>
            <h2>TAYLOR SWIFT</h2>
            <p class="tagline">Every era tells a story</p>
        </div>
    </section>
    <section class="section-4">
        <div>
            <h2>SABRINA CARPENTER</h2>
            <p class="tagline">A little espresso a lot of sabrina</p>
        </div>
    </section>
   </body>
</html>
